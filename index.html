<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ganesh Chaturthi Greeting | Ideal Computer Education</title>

  <!-- Three.js + GLTFLoader -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090312;
      font-family: Georgia, "Times New Roman", serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      text-align: center;
      color: #fff;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(255,143,0,.16), transparent 32%),
        radial-gradient(circle at center, rgba(92,28,145,.28), transparent 65%);
    }

    #hint {
      margin-top: min(65vh, 520px);
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: .85;
      animation: pulse 1.7s infinite;
    }

    #title {
      position: absolute;
      top: 7%;
      font-size: clamp(23px, 6vw, 44px);
      letter-spacing: 2px;
      text-shadow: 0 0 18px #ff9d00;
      opacity: 0;
      transition: opacity 1.5s;
    }

    #greeting {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 700px;
      text-align: center;
      color: #fff;
      opacity: 0;
      transition: opacity 2s;
      pointer-events: none;
      text-shadow: 0 2px 15px #000;
    }

    #greeting .main {
      font-size: clamp(25px, 7vw, 52px);
      font-weight: bold;
      letter-spacing: 1px;
    }

    #greeting .from {
      margin-top: 12px;
      font-family: Arial, sans-serif;
      font-size: clamp(15px, 4vw, 23px);
      letter-spacing: 2px;
    }

    #start {
      position: fixed;
      z-index: 30;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 27px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: white;
      font-size: 15px;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
      display: none;
    }

    @keyframes pulse {
      0%,100% { opacity: .35; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }
  </style>
</head>

<body>
  <canvas id="scene"></canvas>

  <div id="intro">
    <div id="title">🙏 Ganpati Bappa Morya 🙏</div>
    <div id="hint">Touch the Modak</div>
  </div>

  <div id="greeting">
    <div class="main">श्री गणेश चतुर्थी की हार्दिक शुभकामनाएँ</div>
    <div class="from">With warm wishes from<br><strong>Ideal Computer Education, Titilagarh</strong></div>
  </div>

  <!-- Put your own bhajan file in assets/bhajan.mp3 -->
  <audio id="bhajan" preload="auto">
    <source src="assets/bhajan.mp3" type="audio/mpeg">
  </audio>

<script>
/*
  ============================================================
  GITHUB-READY GANESH GREETING
  ============================================================

  Add these files to your repository:

    index.html
    assets/
      modak.glb
      ganesh.glb
      bhajan.mp3

  The code includes a fallback 3D modak/Ganesh-style scene if
  the GLB models aren't present, so the page remains usable.
*/

const canvas = document.getElementById("scene");
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x090312, 0.035);

const camera = new THREE.PerspectiveCamera(
  45, innerWidth / innerHeight, 0.1, 100
);
camera.position.set(0, 1.1, 7);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

scene.add(new THREE.AmbientLight(0xffd7a0, 2.2));

const keyLight = new THREE.PointLight(0xffa52f, 5, 12);
keyLight.position.set(2, 4, 4);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x9c6cff, 4, 10);
fillLight.position.set(-4, 1, 2);
scene.add(fillLight);

/* ---------------- BACKGROUND PARTICLES ---------------- */

const starsGeo = new THREE.BufferGeometry();
const starCount = 900;
const positions = new Float32Array(starCount * 3);

for (let i = 0; i < starCount; i++) {
  positions[i * 3] = (Math.random() - .5) * 22;
  positions[i * 3 + 1] = (Math.random() - .5) * 15;
  positions[i * 3 + 2] = (Math.random() - .5) * 12;
}

starsGeo.setAttribute(
  "position",
  new THREE.BufferAttribute(positions, 3)
);

const stars = new THREE.Points(
  starsGeo,
  new THREE.PointsMaterial({
    color: 0xffd889,
    size: .035,
    transparent: true,
    opacity: .8
  })
);
scene.add(stars);

/* ---------------- FALLBACK MODAK ---------------- */

const modakGroup = new THREE.Group();
scene.add(modakGroup);

function createModak() {
  const group = new THREE.Group();

  const bodyGeo = new THREE.SphereGeometry(1.05, 48, 32);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0xf4a23a,
    roughness: .42,
    metalness: .05
  });

  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.scale.set(1, 1.15, 1);
  group.add(body);

  // Modak ridges
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    const ridge = new THREE.Mesh(
      new THREE.TorusGeometry(.82, .055, 10, 30),
      new THREE.MeshStandardMaterial({
        color: 0xffc15a,
        roughness: .35
      })
    );
    ridge.rotation.x = Math.PI / 2;
    ridge.position.y = -.1 + Math.sin(a) * .02;
    ridge.scale.set(1, .65, 1);
    group.add(ridge);
    ridge.rotation.z = a;
  }

  // Crown tip
  const tip = new THREE.Mesh(
    new THREE.ConeGeometry(.28, .7, 32),
    new THREE.MeshStandardMaterial({
      color: 0xffb347,
      roughness: .35
    })
  );
  tip.position.y = 1.25;
  group.add(tip);

  return group;
}

const fallbackModak = createModak();
modakGroup.add(fallbackModak);

/* ---------------- LOAD GLB MODAK ---------------- */

const loader = new THREE.GLTFLoader();
let loadedModak = null;
let loadedGanesh = null;

loader.load(
  "assets/modak.glb",
  gltf => {
    loadedModak = gltf.scene;
    loadedModak.scale.setScalar(2.1);
    loadedModak.position.y = -1;
    modakGroup.add(loadedModak);
    fallbackModak.visible = false;
  },
  undefined,
  () => console.log("Custom modak.glb not found; using fallback.")
);

/* ---------------- GANESH REVEAL ---------------- */

const ganeshGroup = new THREE.Group();
ganeshGroup.visible = false;
scene.add(ganeshGroup);

loader.load(
  "assets/ganesh.glb",
  gltf => {
    loadedGanesh = gltf.scene;
    loadedGanesh.scale.setScalar(2.0);
    loadedGanesh.position.y = -1.4;
    ganeshGroup.add(loadedGanesh);
  },
  undefined,
  () => {
    // Simple fallback golden Ganesh silhouette
    createFallbackGanesh();
  }
);

function createFallbackGanesh() {
  const g = new THREE.Group();

  const mat = new THREE.MeshStandardMaterial({
    color: 0xff9e32,
    roughness: .3,
    metalness: .15
  });

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(1.15, 32, 24), mat
  );
  head.scale.set(1, 1.05, .8);
  g.add(head);

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.18, .34, 1.45, 24), mat
  );
  trunk.position.set(0, -.55, .72);
  trunk.rotation.x = -.25;
  g.add(trunk);

  const earGeo = new THREE.SphereGeometry(.6, 24, 16);

  const leftEar = new THREE.Mesh(earGeo, mat);
  leftEar.scale.set(.55, 1.15, .25);
  leftEar.position.set(-1.0, .05, 0);
  g.add(leftEar);

  const rightEar = leftEar.clone();
  rightEar.position.x = 1.0;
  g.add(rightEar);

  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a0810 });
  [-.38, .38].forEach(x => {
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(.09, 16, 12), eyeMat
    );
    eye.position.set(x, .22, .78);
    g.add(eye);
  });

  const crown = new THREE.Mesh(
    new THREE.ConeGeometry(.6, 1.0, 5),
    new THREE.MeshStandardMaterial({color: 0xffd45b, metalness: .4})
  );
  crown.position.y = 1.35;
  g.add(crown);

  g.position.y = -1.2;
  ganeshGroup.add(g);
}

/* ---------------- TOUCH / RAYCAST ---------------- */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let activated = false;

function touchModak(x, y) {
  if (activated) return;

  pointer.x = (x / innerWidth) * 2 - 1;
  pointer.y = -(y / innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);

  const targets = [];
  modakGroup.traverse(o => {
    if (o.isMesh) targets.push(o);
  });

  if (raycaster.intersectObjects(targets, true).length) {
    breakModak();
  }
}

addEventListener("pointerdown", e => touchModak(e.clientX, e.clientY));

/* ---------------- BREAK SEQUENCE ---------------- */

function breakModak() {
  activated = true;

  document.getElementById("hint").style.display = "none";

  // User interaction permits audio playback.
  // It starts at the reveal/break moment below.
  const bhajan = document.getElementById("bhajan");

  const start = performance.now();
  const duration = 850;

  // Animate modak shrinking/cracking away
  function breakAnimation(now) {
    const p = Math.min((now - start) / duration, 1);

    const ease = 1 - Math.pow(1 - p, 3);

    modakGroup.rotation.z = Math.sin(p * Math.PI * 5) * .06 * (1-p);
    modakGroup.scale.setScalar(1 - ease * .85);
    modakGroup.position.y = ease * .25;

    if (p < 1) {
      requestAnimationFrame(breakAnimation);
    } else {
      modakGroup.visible = false;
      revealGanesh();

      // BHajan begins exactly at the reveal/break moment.
      bhajan.currentTime = 0;
      bhajan.play().catch(() => {
        // If a browser still blocks it, a later interaction can retry.
        console.log("Audio playback was blocked by the browser.");
      });
    }
  }

  requestAnimationFrame(breakAnimation);

  // Small crack burst first
  burstParticles(0, 0, 0, 0xffb52e, 90);
}

/* ---------------- GANESH REVEAL ---------------- */

function revealGanesh() {
  ganeshGroup.visible = true;
  ganeshGroup.scale.setScalar(.05);

  const start = performance.now();
  const duration = 1100;

  function reveal(now) {
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1-p, 4);

    ganeshGroup.scale.setScalar(.05 + ease * .95);

    if (p < 1) requestAnimationFrame(reveal);
  }

  requestAnimationFrame(reveal);

  document.getElementById("title").style.opacity = "1";
  document.getElementById("greeting").style.opacity = "1";

  flowerShower();
  colorExplosion();
  fireworks();
}

/* ---------------- PARTICLE SYSTEM ---------------- */

const celebration = [];

function burstParticles(x, y, z, color, count) {
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(.025 + Math.random()*.035, 8, 8),
      new THREE.MeshBasicMaterial({
        color,
        transparent: true
      })
    );

    mesh.position.set(x, y, z);
    scene.add(mesh);

    const v = new THREE.Vector3(
      (Math.random()-.5) * 5,
      (Math.random()-.2) * 5,
      (Math.random()-.5) * 4
    );

    celebration.push({
      mesh,
      velocity: v,
      life: 1.5
    });
  }
}

function flowerShower() {
  const flowerColors = [0xffd34d, 0xff8a00, 0xff4b5c, 0xffc2e9];

  for (let i = 0; i < 100; i++) {
    const color = flowerColors[Math.floor(Math.random()*flowerColors.length)];

    const petal = new THREE.Mesh(
      new THREE.SphereGeometry(.07, 8, 6),
      new THREE.MeshBasicMaterial({ color })
    );

    petal.position.set(
      (Math.random()-.5) * 10,
      6 + Math.random()*5,
      (Math.random()-.5) * 5
    );

    scene.add(petal);

    celebration.push({
      mesh: petal,
      velocity: new THREE.Vector3(
        (Math.random()-.5)*.7,
        -1.5-Math.random()*2,
        (Math.random()-.5)*.4
      ),
      life: 5 + Math.random()*3
    });
  }
}

function colorExplosion() {
  const colors = [0xff1744, 0xffd500, 0x00e676, 0x2979ff, 0xd500f9];

  colors.forEach((c, index) => {
    setTimeout(() => {
      burstParticles(
        (Math.random()-.5)*2,
        0,
        0,
        c,
        55
      );
    }, index * 130);
  });
}

function fireworks() {
  for (let f = 0; f < 7; f++) {
    setTimeout(() => {
      const x = (Math.random()-.5)*8;
      const y = 1.5 + Math.random()*4;
      const z = (Math.random()-.5)*3;
      const color = [0xffd740,0xff4081,0x40c4ff,0x69f0ae][f%4];

      burstParticles(x,y,z,color,70);
    }, f * 450);
  }
}

/* ---------------- ANIMATION LOOP ---------------- */

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  stars.rotation.y = t * .015;

  if (!activated) {
    modakGroup.rotation.y = Math.sin(t*.7)*.15;
    modakGroup.position.y = Math.sin(t*1.4)*.08;
    modakGroup.rotation.x = Math.sin(t*.45)*.04;
  } else {
    ganeshGroup.rotation.y = Math.sin(t*.35)*.08;
  }

  for (let i = celebration.length - 1; i >= 0; i--) {
    const p = celebration[i];

    p.mesh.position.addScaledVector(p.velocity, .016);
    p.velocity.y -= .035;
    p.mesh.rotation.x += .05;
    p.mesh.rotation.z += .04;
    p.life -= .016;

    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      celebration.splice(i,1);
    }
  }

  renderer.render(scene, camera);
}

animate();

/* ---------------- RESPONSIVE ---------------- */

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/*
  IMPORTANT:
  Replace assets/bhajan.mp3 with the Ganesh bhajan you have
  permission to use. For a public QR greeting, use music that
  you have the right to distribute.
*/
</script>
</body>
</html>
